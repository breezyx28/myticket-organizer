  /api/v1/main/auth/register:
    post:
      summary: ''
      operationId: postApiV1MainAuthRegister
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'Must be a valid email address. Must not be greater than 255 characters.'
                  example: gbailey@example.net
                phone:
                  type: string
                  description: 'Must not be greater than 20 characters.'
                  example: miyvdljnikhwaykc
                  nullable: true
                password:
                  type: string
                  description: 'Must be at least 8 characters.'
                  example: w/kXaz<m5
                full_name:
                  type: string
                  description: 'Must not be greater than 160 characters.'
                  example: r
                display_name:
                  type: string
                  description: 'Must not be greater than 160 characters.'
                  example: s
                  nullable: true
              required:
                - email
                - password
                - full_name
      security: []
  /api/v1/main/auth/login:
    post:
      summary: ''
      operationId: postApiV1MainAuthLogin
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'This field is required when <code>phone</code> is not present. Must be a valid email address.'
                  example: gbailey@example.net
                phone:
                  type: string
                  description: 'This field is required when <code>email</code> is not present. Must not be greater than 20 characters.'
                  example: miyvdljnikhwaykc
                password:
                  type: string
                  description: ''
                  example: '|]|{+-'
                otp:
                  type: string
                  description: ''
                  example: architecto
                  nullable: true
              required:
                - password
      security: []
