openapi: 3.0.3
info:
  title: 'MyTicket API Documentation'
  description: ''
  version: 1.0.0
servers:
  -
    url: 'http://localhost:8000'
tags:
  -
    name: Endpoints
    description: ''
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'Authenticate with `Authorization: Bearer {sanctum_token}`. Tokens are scoped by app abilities (`app:main`, `app:admin`, `app:organizer`, `app:scanner`). For `POST .../auth/refresh`, send the **current** access token in the `Authorization` header only; no `refresh_token` body is used.'
security:
  -
    default: []
paths:
  /api/oauth2-callback:
    get:
      summary: 'Handles the OAuth2 callback and retrieves the required file for the redirect.'
      operationId: handlesTheOAuth2CallbackAndRetrievesTheRequiredFileForTheRedirect
      description: ''
      parameters: []
      responses:
        200:
          description: ''
          content:
            text/plain:
              schema:
                type: string
                example: "<!doctype html>\n<html lang=\"en-US\">\n<body>\n<script src=\"oauth2-redirect.js\"></script>\n</body>\n</html>\n"
      tags:
        - Endpoints
      security: []
  /api/v1/main/health:
    get:
      summary: ''
      operationId: getApiV1MainHealth
      description: ''
      parameters: []
      responses:
        500:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Server Error'
                properties:
                  message:
                    type: string
                    example: 'Server Error'
      tags:
        - Endpoints
      security: []
  /api/v1/main/version:
    get:
