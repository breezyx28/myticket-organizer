                        slug:
                          type: string
                          example: family
                        name:
                          type: string
                          description: English display name (same as stored name_en)
                          example: Family & Kids
                        name_ar:
                          type: string
                        events_count:
                          type: integer
                          description: Count of published, non-deleted events in this category
                          example: 12
                      required:
                        - id
                        - slug
                        - name
                        - name_ar
                        - events_count
        500:
          description: ''
          content:
            application/json:
              schema:
                type: object
